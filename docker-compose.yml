services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
    ports:
      - "5432:5432"
    volumes:
      - jarvis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jarvis:jarvis@db:5432/jarvis
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jarvis:jarvis@db:5432/jarvis
    depends_on:
      db:
        condition: service_healthy

volumes:
  jarvis_pgdata:
